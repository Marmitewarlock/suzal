<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linum catharticum</title>
  <link rel="alternate" type="application/rss+xml" href="https://linumcatharticum.substack.com/feed">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;200;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/theme.css">
  <style>
    a, a:hover, .post-item a, .post-item a * { text-decoration: none; }

    /* Keep line breaks inside paragraphs (poems etc.) */
    .post-item .post-description { white-space: pre-line !important; }

    /* Collapse long posts at ~24 lines (1.2rem font x 1.5 line-height) */
    .post-text { max-height: 20rem; overflow: hidden; }
    .post-item.open .post-text { max-height: none; }
    .post-toggle { margin-top: 0.8rem; }
    .post-toggle[hidden] { display: none; }

    /* Two-column post grid; one column on narrow screens.
       align-items: start so expanding one card doesn't stretch its neighbour. */
    .post-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.9rem;
      align-items: start;
    }
    .post-list .post-item { margin-bottom: 0; }
    @media (max-width: 800px) {
      .post-list { grid-template-columns: 1fr; }
    }
  </style>
  <script>
    // Apply saved/system theme before paint to avoid a flash
    (function () {
      try {
        var saved = localStorage.getItem("theme");
        var dark = saved ? saved === "dark"
                         : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("theme-dark");
      } catch (e) {}
    })();
  </script>
</head>
<body>
<div id="app">
  <div class="rv-layout">

    <aside class="rv-sidebar">
      <div class="rv-blog-header">
        <h1>Linum catharticum</h1>
      </div>
      <nav class="rv-sidebar-nav">
        <a href="./">Home</a>
        <a href="blog/">Blog</a>
        <a href="zines/">Zines</a>
        <a href="links/">Links</a>
      </nav>
    </aside>

    <main class="rv-content">
      <div class="rv-crest-line"></div>

      <div id="posts" class="post-list">Loading posts…</div>
    </main>

  </div>

  <footer class="site-footer">
    <p class="rv-small">© <span id="year"></span> My Blog</p>
  </footer>
</div>

<button class="rv-theme-toggle" id="theme-toggle" aria-label="Toggle light/dark theme">◐</button>

<script>
  const SUBSTACK = "https://linumcatharticum.substack.com";
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // Turn a post's full HTML into plain-text paragraphs (drops images, buttons, widgets)
  function toParagraphs(html) {
    const doc = new DOMParser().parseFromString(html, "text/html");
    doc.querySelectorAll("br").forEach(br => br.replaceWith("\n"));
    doc.querySelectorAll("figure, picture, .button-wrapper, .subscription-widget-wrap, script, style")
       .forEach(el => el.remove());
    return [...doc.body.querySelectorAll("p, h1, h2, h3, h4, h5, h6, li")]
      .map(el => el.textContent.trim())
      .filter(Boolean);
  }

  document.getElementById("year").textContent = new Date().getFullYear();

  // Theme toggle
  document.getElementById("theme-toggle").addEventListener("click", () => {
    const dark = document.documentElement.classList.toggle("theme-dark");
    try { localStorage.setItem("theme", dark ? "dark" : "light"); } catch (e) {}
  });

  // Posts from the Substack RSS feed
  fetch("https://api.rss2json.com/v1/api.json?rss_url=" +
        encodeURIComponent(SUBSTACK + "/feed"))
    .then(r => r.json())
    .then(d => {
      if (!d.items || !d.items.length) throw new Error("No posts");
      document.getElementById("posts").innerHTML = d.items.map(p => {
        const thumb = p.thumbnail || (p.enclosure && p.enclosure.link) || "";
        const paras = toParagraphs(p.content || p.description || "");
        const date = new Date(p.pubDate.replace(" ", "T") + "Z")
          .toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });
        return `
          <article class="post-item">
            <a href="${esc(p.link)}">
              <div class="post-body">
                <div class="post-title">${esc(p.title)}</div>
                <div class="rv-small">${esc(date)}</div>
                <div class="post-text">${paras.map(t => `<p class="post-description">${esc(t)}</p>`).join("")}</div>
              </div>
              ${thumb ? `<img class="post-thumb" src="${esc(thumb)}" alt="">` : ""}
            </a>
            <button class="rv-btn post-toggle" type="button" hidden>Read more</button>
          </article>`;
      }).join("");

      const postsEl = document.getElementById("posts");
      const checkOverflow = () => postsEl.querySelectorAll(".post-item").forEach(card => {
        const text = card.querySelector(".post-text");
        const btn = card.querySelector(".post-toggle");
        if (card.classList.contains("open")) { btn.hidden = false; return; }
        btn.hidden = text.scrollHeight <= text.clientHeight + 2;
      });
      postsEl.addEventListener("click", e => {
        const btn = e.target.closest(".post-toggle");
        if (!btn) return;
        const open = btn.closest(".post-item").classList.toggle("open");
        btn.textContent = open ? "Show less" : "Read more";
      });
      checkOverflow();
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(checkOverflow);
      window.addEventListener("resize", checkOverflow);
    })
    .catch(() => {
      document.getElementById("posts").innerHTML =
        `<p>Couldn't load posts. <a href="${SUBSTACK}">Read on Substack</a>.</p>`;
    });
</script>
</body>
</html>
