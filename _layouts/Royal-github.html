<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }}</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>

<body>

  <!-- Royal Velvet Header -->
  <header class="rv-blog-header royal-crest">
    <div class="crest-line"></div>

    <h1 class="rv-blog-title">{{ page.title }}</h1>

    {% if page.subtitle %}
      <h2 class="rv-blog-subtitle">{{ page.subtitle }}</h2>
    {% endif %}

    <img src="/favicon.png" class="rv-blog-favicon-between">

    {% if page.description %}
      <h4 class="rv-blog-description"><i>{{ page.description }}</i></h4>
    {% endif %}

    <div class="crest-line"></div>
  </header>

  <!-- GitHub‑style content container -->
  <main class="github-container">
    {{ content }}
  </main>

  <!-- Floating Theme Toggle -->
  <button id="theme-toggle" class="rv-theme-toggle" aria-label="Toggle theme">
    <span class="rv-toggle-icon">🌙</span>
  </button>

  <script>
    const toggleBtn = document.querySelector("#theme-toggle");
    const icon = toggleBtn.querySelector(".rv-toggle-icon");

    function updateIcon() {
      icon.textContent = document.body.classList.contains("theme-dark") ? "🌙" : "☀️";
    }

    toggleBtn.addEventListener("click", () => {
      document.body.classList.toggle("theme-dark");
      updateIcon();
    });

    updateIcon();
  </script>

</body>
</html>
