<!-- ⭐ Callout Conversion Script -->
<script>
document.querySelectorAll("blockquote").forEach(b => {
  const first = b.firstElementChild;
  if (!first) return;

  const match = first.textContent.match(/^\[!(\w+)\]\s*(.*)/);
  if (!match) return;

  const type = match[1].toLowerCase();
  const title = match[2] || type;

  const wrapper = document.createElement("div");
  wrapper.classList.add("callout", `callout-${type}`);

  const titleEl = document.createElement("div");
  titleEl.classList.add("callout-title");
  titleEl.textContent = title;
  wrapper.appendChild(titleEl);

  const contentEl = document.createElement("div");
  contentEl.classList.add("callout-content");

  [...b.children].slice(1).forEach(child => contentEl.appendChild(child));
  wrapper.appendChild(contentEl);

  b.replaceWith(wrapper);
});
</script>
