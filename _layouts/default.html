<!DOCTYPE html>
<html lang="en" class="theme-dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ page.title }} — {{ site.title }}</title>

  <!-- Roboto Thin (100) -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;200;300;400&display=swap" rel="stylesheet">

  <!-- Royal Velvet CSS -->
  <link rel="stylesheet" href="{{ '/assets/css/royal-velvet.css' | relative_url }}">
</head>

<body class="theme-dark">

  <!-- Royal Velvet Header -->
  <header class="rv-blog-header royal-crest">
    <div class="crest-line"></div>

    <h1 class="rv-blog-title">{{ page.title }}</h1>

    {% if page.subtitle %}
      <h2 class="rv-blog-subtitle">{{ page.subtitle }}</h2>
    {% endif %}

    <img src="/favicon.png" class="rv-header-image" alt="">

    {% if page.description %}
      <h4 class="rv-blog-description"><i>{{ page.description }}</i></h4>
    {% endif %}

    <div class="crest-line"></div>
  </header>

  <div class="app-container">
    <div class="workspace">
      <div class="mod-root">
        <div class="workspace-leaf">
          <div class="workspace-leaf-content">
            <div class="view-content">

              {% capture raw %}{{ content }}{% endcapture %}
              {% assign cleaned = raw 
                | replace: 'class="markdown-body"', '' 
                | replace: "markdown-body", "" 
              %}

              <div class="markdown-preview-view">
                <div class="markdown-preview-sizer markdown-preview-section">
                  {{ cleaned }}
                </div>
              </div>

            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
