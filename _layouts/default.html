<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="/assets/images/favicon.png">
  <title>{{ page.title }} — {{ site.title }}</title>

  <!-- Roboto Thin (100) -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;200;300;400&display=swap" rel="stylesheet">

  <!-- Royal Velvet CSS -->
  <link rel="stylesheet" href="{{ '/assets/css/royal-velvet2.css' | relative_url }}">
</head>

<body>

<!-- ⭐ Theme Toggle Button -->
<button id="theme-toggle" class="rv-theme-toggle" aria-label="Toggle theme">
  <span class="rv-toggle-icon">🌙</span>
</button>

<header class="rv-blog-header royal-crest">

  <header class="rv-blog-header royal-crest">
  <h1>{{ page.title }}</h1>
 <img class="rv-header-image" src="/assets/images/favicon.png" alt="Site logo">
  <h2>{{ page.subtitle }}</h2>

  <div class="rv-crest-line"></div>
</header>


<!-- ⭐ Clean content wrapper -->
<main class="rv-content">
  {{ content }}
</main>

<!-- ⭐ Callout Conversion Script -->
<script>
document.querySelectorAll("blockquote").forEach(b => {
  const first = b.firstElementChild;
  if (!first) return;

  const match = first.textContent.match(/^\[!(\w+)\]\s*(.*)/);
  if (!match) return;

  const type = match[1].toLowerCase();
  const title = match[2] || type;

  const wrapper = document.createElement("div");
  wrapper.classList.add("callout", `callout-${type}`);

  const titleEl = document.createElement("div");
  titleEl.classList.add("callout-title");
  titleEl.textContent = title;
  wrapper.appendChild(titleEl);

  const contentEl = document.createElement("div");
  contentEl.classList.add("callout-content");

  [...b.children].slice(1).forEach(child => contentEl.appendChild(child));
  wrapper.appendChild(contentEl);

  b.replaceWith(wrapper);
});
</script>

<div class="rv-lightbox">
  <img src="" alt="">
</div>

<footer class="rv-blog-footer royal-crest">
  <div class="rv-crest-line"></div>

  <p class="rv-footer-text">
    <a href="/">suz.al</a> —
    <a href="http://blog.suz.al">blog</a> —
    <a href="http://suz.al/zines">zines</a> —
    <a href="http://suz.al/links">links</a>
  </p>

  <p class="tiny">© suz.al {{ site.time | date: "%Y" }}</p>

  <div class="rv-crest-line"></div>
</footer>

<!-- ⭐ Theme Toggle Script -->
<script>
  const root = document.documentElement;
  const toggle = document.getElementById("theme-toggle");
  const icon = toggle.querySelector(".rv-toggle-icon");

  // Load saved theme
  const saved = localStorage.getItem("theme");
  if (saved === "dark") {
    root.classList.add("theme-dark");
    icon.textContent = "☀️";
  }

  // Toggle handler
  toggle.addEventListener("click", () => {
    const isDark = root.classList.toggle("theme-dark");
    icon.textContent = isDark ? "☀️" : "🌙";
    localStorage.setItem("theme", isDark ? "dark" : "light");
  } );
</script>

</body>
</html>
