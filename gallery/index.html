<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery — Suzy Writes</title>
<link rel="icon" sizes="32x32" href="../favicon.png">
<link rel="stylesheet" href="../theme.css">
</head>
<body>
  <div class="rv-layout">
    <aside class="rv-sidebar">
      <header class="rv-blog-header">
        <h1>Suzy Writes</h1>
      </header>
      <nav class="rv-sidebar-nav">
        <a href="../">Home</a>
        <a href="../blog/">Blog</a>
        <a href="../zines/">Zines</a>
        <a href="../links/">Links</a>
        <a href="./">Gallery</a>
      </nav>
    </aside>

    <main class="rv-content">
      <div class="rv-crest-line"></div>

      <h1>Gallery</h1>

      <!-- ─── Add one .rv-gallery-item per photo ─── -->
      <div class="rv-gallery-list">

        <div class="rv-gallery-item">
          <img src="https://example.com/photo1.jpg" alt="Description of photo 1">
          <div class="rv-gallery-text">
            <h2>Photo title</h2>
            <p>Whatever you'd like to say about this one.</p>
          </div>
        </div>

        <div class="rv-gallery-item">
          <img src="https://example.com/photo2.jpg" alt="Description of photo 2">
          <div class="rv-gallery-text">
            <h2>Another photo</h2>
            <p>More text goes here, next to the image.</p>
          </div>
        </div>

      </div>

      <footer class="site-footer"></footer>
    </main>
  </div>

  <button class="rv-theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">🌙</button>

  <script>
    const themeToggleBtn = document.getElementById("theme-toggle");
    const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    const savedTheme = localStorage.getItem("rv-theme");

    function applyTheme(isDark) {
      document.documentElement.classList.toggle("theme-dark", isDark);
      themeToggleBtn.textContent = isDark ? "☀️" : "🌙";
    }

    applyTheme(savedTheme ? savedTheme === "dark" : prefersDark);

    themeToggleBtn.addEventListener("click", () => {
      const isDark = !document.documentElement.classList.contains("theme-dark");
      applyTheme(isDark);
      localStorage.setItem("rv-theme", isDark ? "dark" : "light");
    });
  </script>
</body>
</html>
